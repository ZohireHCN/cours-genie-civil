<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="Segoe UI, Arial, sans-serif" font-size="13" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="480" y="26" text-anchor="middle" font-size="17" font-weight="600" fill="#1d2420">Coupe schématique : marge passive (à gauche) et marge active (à droite)</text>
  <!-- eau -->
  <path d="M170,120 L960,120 L960,140 L800,140 Z" fill="none"/>
  <path d="M170,120 L250,128 L320,220 L400,262 L520,268 L560,205 L600,268 L700,272 L770,360 L800,140 L815,120 Z" fill="#bfe3ea"/>
  <!-- croûte continentale gauche -->
  <path d="M0,120 L170,120 L250,128 L320,220 L400,262 L400,300 L0,300 Z" fill="#d9c7a7" stroke="#7a6248"/>
  <!-- croûte océanique -->
  <path d="M400,262 L520,268 L560,205 L600,268 L700,272 L770,360 L760,380 L690,300 L400,300 Z" fill="#8f9aa3" stroke="#4d5861"/>
  <!-- plaque plongeante -->
  <path d="M770,360 L900,410 L880,418 L760,380 Z" fill="#8f9aa3" stroke="#4d5861"/>
  <!-- croûte continentale droite -->
  <path d="M770,360 L800,140 L815,120 L960,120 L960,330 L900,410 Z" fill="#d9c7a7" stroke="#7a6248"/>
  <!-- volcan -->
  <path d="M860,120 L880,78 L900,120 Z" fill="#b0563a" stroke="#6e2f1e"/>
  <path d="M880,78 C870,60 895,55 885,40" fill="none" stroke="#777" stroke-width="2"/>
  <!-- magma -->
  <path d="M880,120 L820,340" stroke="#d2462a" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- niveau de la mer -->
  <line x1="170" y1="120" x2="815" y2="120" stroke="#2a7f99" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="440" y="113" fill="#2a7f99">niveau de la mer</text>
  <!-- étiquettes -->
  <g fill="#1d2420">
    <text x="20" y="110">Continent</text>
    <text x="40" y="200" font-weight="600" fill="#2f6b57">MARGE PASSIVE</text>
    <text x="40" y="218" fill="#2f6b57">structure continue,</text>
    <text x="40" y="234" fill="#2f6b57">pas d'activité tectonique</text>
    <text x="155" y="150">a. Plateau</text><text x="155" y="165">(0 à 150-180 m)</text>
    <text x="270" y="190" text-anchor="end">b. Talus</text><text x="270" y="205" text-anchor="end">(4° à 5°)</text>
    <text x="330" y="250" text-anchor="end">c. Glacis</text>
    <text x="440" y="290">d. Plaine abyssale (≈ 5 000 m)</text>
    <text x="560" y="195" text-anchor="middle">e. Dorsale</text>
    <text x="700" y="385" text-anchor="end">Fosse océanique</text>
    <text x="755" y="300" text-anchor="end" font-size="12">subduction</text>
    <text x="900" y="65">volcan</text>
    <text x="720" y="62" font-weight="600" fill="#a5552f" text-anchor="middle">MARGE ACTIVE</text>
    <text x="720" y="80" fill="#a5552f" text-anchor="middle">subduction, fosse, séismes, volcans</text>
    <text x="950" y="150" text-anchor="end">Continent</text>
  </g>
  <!-- légende -->
  <g font-size="12">
    <rect x="20" y="330" width="14" height="14" fill="#d9c7a7" stroke="#7a6248"/><text x="40" y="342">Croûte continentale</text>
    <rect x="20" y="352" width="14" height="14" fill="#8f9aa3" stroke="#4d5861"/><text x="40" y="364">Croûte océanique</text>
    <rect x="20" y="374" width="14" height="14" fill="#bfe3ea"/><text x="40" y="386">Océan</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
